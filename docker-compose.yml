services:
  mail:
    image: boky/postfix:latest
    container_name: blinvpn_mail
    restart: unless-stopped
    environment:
      ALLOWED_SENDER_DOMAINS: ${MAIL_DOMAIN:-localhost}
      POSTFIX_myhostname: ${MAIL_DOMAIN:-localhost}
    expose:
      - "25"

  bot:
    build:
      context: .
      dockerfile: deploy/Dockerfile.bot
      network: host
    container_name: blinvpn_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - webhook

  webhook:
    build:
      context: .
      dockerfile: deploy/Dockerfile.webhook
      network: host
    container_name: blinvpn_webhook
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEBHOOK_PORT:-5000}:5000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
      network: host
    container_name: blinvpn_api
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      - mail

  miniapp:
    build:
      context: .
      dockerfile: deploy/Dockerfile.miniapp
      network: host
    container_name: blinvpn_miniapp
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MINIAPP_PORT:-9741}:3000"
    env_file:
      - .env
    depends_on:
      - api

  panel:
    build:
      context: .
      dockerfile: deploy/Dockerfile.panel
      network: host
    container_name: blinvpn_panel
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PANEL_PORT:-9742}:3000"
    env_file:
      - .env
    depends_on:
      - api

volumes:
  data:
